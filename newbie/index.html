<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:var(--font);background:var(--bg);color:var(--text);display:flex;justify-content:center;}
  .app{width:100%;max-width:560px;height:100vh;height:100dvh;display:flex;flex-direction:column;background:var(--panel);box-shadow:0 0 0 1px var(--line)}
  header{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line);position:relative;flex-shrink:0}
  .avatar{width:42px;height:42px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-size:18px;flex-shrink:0}
  .title{font-family:var(--font-title);font-weight:var(--title-weight);font-size:var(--title-size);line-height:1.2}
  .status{font-size:13px;color:var(--muted)}
  .status::before{content:'';display:inline-block;width:7px;height:7px;border-radius:50%;background:#4CB87A;margin-right:6px;vertical-align:1px}
  .progress{position:absolute;left:0;bottom:-1px;height:3px;background:var(--accent);width:0;transition:width .5s ease;border-radius:0 3px 3px 0}
  #chat{flex:1;overflow-y:auto;padding:20px 14px 12px;display:flex;flex-direction:column;gap:6px}
  .msg{max-width:84%;padding:10px 14px;border-radius:18px;line-height:1.45;font-size:15px;white-space:pre-wrap;overflow-wrap:anywhere;border-radius:var(--radius)}
  .bot{align-self:flex-start;background:var(--bot);border:1px solid var(--line);border-bottom-left-radius:var(--tail)}
  .user{align-self:flex-end;background:var(--user);color:var(--user-text);border-bottom-right-radius:var(--tail);margin:6px 0}
  .new{animation:pop .22s ease-out}
  .typing{display:flex;gap:4px;padding:14px 16px}
  .typing span{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:blink 1.2s infinite}
  .typing span:nth-child(2){animation-delay:.2s}
  .typing span:nth-child(3){animation-delay:.4s}
  .note{align-self:center;font-size:12px;color:var(--muted);padding:8px 0}
  @keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  @keyframes blink{0%,60%,100%{opacity:.25}30%{opacity:1}}
  @media (prefers-reduced-motion: reduce){.new,.typing span{animation:none}.progress{transition:none}}

  footer{border-top:1px solid var(--line);padding:12px 14px calc(12px + env(safe-area-inset-bottom));background:var(--panel);flex-shrink:0}
  footer:empty{display:none}
  .chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}
  .chip{border:1.5px solid var(--accent);color:var(--accent);background:transparent;padding:9px 14px;border-radius:999px;font:inherit;font-size:14px;font-weight:500;cursor:pointer;transition:background .15s,color .15s}
  .chip:hover{background:var(--accent-soft)}
  .chip.on,.chip.primary{background:var(--accent);color:var(--on-accent)}
  .chip:disabled{opacity:.4;cursor:default}
  .chip:focus-visible,.send:focus-visible,.link:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .hint{font-size:12px;color:var(--muted);margin-bottom:8px;text-align:right}
  .scale{display:grid;grid-template-columns:repeat(10,1fr);gap:6px}
  .scale .chip{padding:10px 0;text-align:center}
  .scale-legend{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:6px}
  .inputrow{display:flex;gap:8px;align-items:flex-end}
  .inputbar{display:contents}
  textarea{flex:1;resize:none;border:1.5px solid var(--line);background:var(--bot);color:var(--text);border-radius:22px;padding:11px 16px;font:inherit;font-size:16px;line-height:1.35;max-height:130px;outline:none}
  textarea:focus{border-color:var(--accent)}
  .send{width:46px;height:46px;border-radius:50%;border:none;background:var(--accent);color:var(--on-accent);cursor:pointer;display:grid;place-items:center;flex-shrink:0}
  .send:disabled{opacity:.35;cursor:default}
  .row2{display:flex;justify-content:flex-end;margin-top:8px}
  .link{background:none;border:none;color:var(--muted);font:inherit;font-size:13px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
  @media (max-width:420px){.scale{grid-template-columns:repeat(5,1fr)}.msg{max-width:88%}}
  /* Стиль в духе интерфейса Claude (тёмная тема) */
  :root{
    --bg:#151515; --panel:#151515; --bot:transparent; --text:#F0EFEC; --muted:#898782;
    --line:#262625; --accent:#D97757; --accent-soft:#2B2B2A; --user:#262625; --user-text:#F0EFEC; --on-accent:#FFFFFF;
    --field:#1E1E1D; --field-border:#343432; --field-border-focus:#4A4946; --chip:#1E1E1D; --chip-hover:#2B2B2A;
    --font:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,'Onest','Helvetica Neue',Arial,sans-serif;
    --font-title:var(--font); --title-size:16px; --title-weight:500; --radius:20px; --tail:20px;
  }
  ::selection{background:rgba(217,119,87,.35)}
  .app{max-width:780px;box-shadow:none}
  header{padding:14px 22px;border-bottom:1px solid var(--line)}
  .avatar,.status{display:none}
  #chat{padding:32px 22px 16px;gap:10px}
  #chat::-webkit-scrollbar{width:8px}
  #chat::-webkit-scrollbar-thumb{background:#2B2B2A;border-radius:8px}
  .bot{background:transparent;border:0;padding:2px 0;max-width:100%;font-size:16px;line-height:1.7;letter-spacing:.005em}
  .typing{padding:12px 0}
  .typing span{background:var(--accent)}
  .user{padding:11px 18px;font-size:16px;line-height:1.5;margin:20px 0;max-width:80%}
  .note{color:var(--muted)}
  footer{border-top:0;padding:6px 22px calc(20px + env(safe-area-inset-bottom))}
  .inputbox{flex-direction:column;align-items:stretch;gap:6px;background:var(--field);border:1px solid var(--field-border);border-radius:22px;padding:16px 12px 12px 20px;box-shadow:0 4px 20px rgba(0,0,0,.25);transition:border-color .15s}
  .inputbox:focus-within{border-color:var(--field-border-focus)}
  textarea{border:0;background:transparent;padding:2px 0;border-radius:0;font-size:16px;outline:none}
  textarea::placeholder{color:#6F6D69}
  .inputbar{display:flex;justify-content:flex-end}
  .send{width:36px;height:36px;border-radius:10px}
  .send svg{transform:rotate(-90deg)}
  .send:disabled{opacity:1;background:#2B2B2A;color:#6F6D69}
  .send:not(:disabled):hover{background:#C6654A}
  .chip{border:1px solid var(--field-border);background:var(--chip);color:var(--text);border-radius:14px;font-weight:400}
  .chip:hover{background:var(--chip-hover)}
  .chip.on{background:#2E2522;border-color:var(--accent);color:var(--text)}
  .chip.primary{background:var(--accent);border-color:var(--accent);color:#FFFFFF;font-weight:500}
  .chip.primary:not(:disabled):hover{background:#C6654A}
  .chip:disabled{opacity:.45}
  .scale .chip{border-radius:10px}
  .hint,.scale-legend{color:var(--muted)}
  textarea:disabled{cursor:default}
  .logo{height:14px;width:auto;display:block;opacity:.9}
  header{min-height:52px}
  /* ===== Стиль основного сайта (Nextpace · local host) ===== */
  :root{
    --bg:#FCFBF9; --panel:#FCFBF9; --text:#14110E; --muted:#7A7267; --line:#E4DDD2;
    --accent:#6D4AFF; --accent-hover:#5A37F0; --accent-soft:#F1EDFF; --lime:#DCF24B;
    --user:#F1EDFF; --user-text:#4B2FD6; --on-accent:#FFFFFF;
    --field:#FFFDFA; --field-border:#D6CEC1; --field-border-focus:#6D4AFF; --chip:#FFFDFA; --chip-hover:#F4F0E9;
    --font:"Wix Madefor Display",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  }
  body{-webkit-font-smoothing:antialiased}
  ::selection{background:rgba(109,74,255,.2)}
  header{background:rgba(252,251,249,.94);backdrop-filter:blur(8px)}
  .brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--text)}
  .np-icon{width:28px;height:28px;border-radius:8px;display:block}
  .np-word{font-weight:700;font-size:19px;letter-spacing:-.03em}
  .brand-sep{width:1px;height:18px;background:var(--field-border)}
  .brand-lh{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:#3A342D}
  .brand-lh i{width:6px;height:6px;border-radius:50%;background:var(--lime);box-shadow:0 0 0 1px rgba(20,17,14,.25)}
  #chat::-webkit-scrollbar-thumb{background:#E4DDD2}
  .bot{font-size:17px;line-height:1.6;font-weight:600;letter-spacing:-.01em;color:var(--text)}
  .bot.past{color:#8C857B;transition:color .6s}
  .user{background:var(--user);color:var(--user-text);font-weight:500}
  .cursor{display:inline-block;margin-left:1px;color:var(--accent);font-weight:600;animation:cur 1s steps(1) infinite}
  @keyframes cur{50%{opacity:0}}
  .typing span{background:var(--accent)}
  .inputbox{box-shadow:0 18px 40px -26px rgba(20,17,14,.35)}
  textarea::placeholder{color:#A39B90}
  .send:disabled{background:#F4F0E9;color:#A39B90}
  .send:not(:disabled):hover{background:var(--accent-hover)}
  .chip{border-color:var(--field-border);color:var(--text)}
  .chip.on{background:var(--accent-soft);border-color:var(--accent);color:#4B2FD6}
  .chip.primary{background:var(--accent);border-color:var(--accent)}
  .chip.primary:not(:disabled):hover{background:var(--accent-hover)}
  .note{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase}
  header > div:not(.avatar):not(.progress){display:flex;align-items:center;gap:16px;min-width:0}
  .head-sub{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-left:16px;border-left:1px solid var(--line)}
  @media (max-width:760px){header > div:not(.avatar):not(.progress){flex-direction:column;align-items:flex-start;gap:4px}
    .head-sub{padding-left:0;border-left:0;font-size:12px;white-space:normal}}
  @media (max-width:420px){.brand-sep,.brand-lh{display:none}}
  @media (prefers-reduced-motion:reduce){.cursor{animation:none}}

<body>
<div class="app">
  <header>
    <div class="avatar" aria-hidden="true">✦</div>
    <div>
      <a class="brand" href="/"><img class="np-icon" src="/assets/nextpace-icon.png" alt="" width="28" height="28"><span class="np-word">Nextpace</span><span class="brand-sep" aria-hidden="true"></span><span class="brand-lh">local host<i></i></span></a>
      <span class="head-sub">Анкета для бьюти-мастеров и салонов · разбор продвижения за 2 минуты</span>
      <div class="status">онлайн</div>
    </div>
    <div class="progress" id="progress"></div>
  </header>
  <main id="chat" aria-live="polite"></main>
  <footer id="composer"></footer>
</div>

<script>
/* ================== НАСТРОЙКИ ================== */
const CONFIG = {
  // Вставьте сюда ссылку веб-приложения Google Apps Script (заканчивается на /exec)
  SCRIPT_URL: 'https://script.google.com/macros/s/AKfycbzjKcDpPM-K2Mw0xbVXy2bWoiIPQO4NEMvu2_pzVlktLkyXB0q3xzk7NlD_lP-7cQZ_2A/exec',
  TYPING_SPEED: 1, // 0.5 — быстрее, 2 — медленнее

  // true — короткая заявка: только имя и контакт
  // false — анкета из 5 вопросов
  SHORT_MODE: false
};

// Вопросы, которые задаются в короткой заявке
const SHORT_IDS = ['name', 'contact'];


const NONE = 'Пока ничего';

/* ================== ВОПРОСЫ ==================
   type: text | choice | multi | scale
   label — название колонки в таблице
   text может быть функцией: a => (разный текст для мастера и салона)
*/
const QUESTIONS = [
  // 1. Ниша и город
  { id:'niche', label:'Ниша', type:'multi',
    intro:['Для начала — немного о вас ✨'],
    text:'В какой нише вы работаете?',
    options:['Маникюр / педикюр','Брови','Ресницы','Волосы','Макияж','Косметология','Массаж','Депиляция','Другое'] },
  { id:'nicheOther', label:'Своя ниша', type:'text',
    text:'Напишите, какие ещё услуги',
    skip: a => !String(a.niche || '').includes('Другое') },
  { id:'city', label:'Город', type:'text',
    text:'В каком городе и районе вы принимаете клиентов?',
    placeholder:'Например: Los Angeles, Santa Monica' },

  // 2. Продвижение
  { id:'channels', label:'Продвижение сейчас', type:'multi',
    text:'Что вы сейчас используете для продвижения? Отметьте всё, где вы есть или запускаете рекламу',
    options:[
      'Instagram','TikTok','Facebook','Telegram','WhatsApp',
      'Google Maps / Google Business','Yelp','Booksy / StyleSeat / Vagaro','Сайт',
      'Реклама Instagram / Facebook','Google Ads','Реклама у блогеров',
      'Русскоязычные группы и чаты','Сарафанное радио', NONE
    ],
    exclusive: NONE,
    react: v => v.includes(NONE) ? 'Ничего страшного — значит, построим всё с чистого листа 🙌' : null },

  // 3. Точка А и цель
  { id:'pointAB', label:'Сейчас → Цель', type:'text',
    intro:['Теперь самое важное 🚀'],
    text:'Где вы сейчас и куда хотите прийти?\nНапример: сейчас 30 клиентов в месяц и около $3,000 → хочу больше клиентов в месяц, открыть студию',
    placeholder:'Сейчас… → Хочу…' },

  // 4. Бюджет
  { id:'adBudget', label:'Бюджет на рекламу', type:'text',
    text:'Какой бюджет на рекламу вы готовы выделять? Можно написать в день или в месяц',
    placeholder:'Например: $30 в день или $900 в месяц' },

  // Контакты
  { id:'name', label:'Имя', type:'text',
    intro:['Спасибо, почти готово!'],
    text:'Как к вам обращаться? Если у вас салон или студия — напишите и название',
    placeholder:'Ваше имя' },
  { id:'contact', label:'Instagram и телефон', type:'text',
    text:'И последнее: оставьте ссылку на ваш Instagram и номер телефона для связи',
    placeholder:'@username, +1 310 555 0123',
    mergeOnRetry: true, // если номера не было, следующий ответ дописывается к предыдущему — Instagram не надо писать заново
    validate: v => {
      const m = v.match(/(^|[^a-zA-Z0-9_.@\/])(\+?\d[\d\s().-]{8,}\d)/);
      const digits = m ? m[2].replace(/\D/g, '').length : 0;
      return (digits >= 10 && digits <= 15)
        ? null
        : (/[a-zA-Z@]/.test(v)
          ? 'Спасибо! Добавьте, пожалуйста, ещё номер телефона, например +1 310 555 0123'
          : 'Напишите, пожалуйста, Instagram и номер телефона целиком, например: @username, +1 310 555 0123');
    } }
];


/* ================== ДВИЖОК ЧАТА ================== */
const chat = document.getElementById('chat');
const composer = document.getElementById('composer');
const progressBar = document.getElementById('progress');
const A = {};


const SEND_ICON = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 12h13M13 6l6 6-6 6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';

const sleep = ms => new Promise(r => setTimeout(r, ms * CONFIG.TYPING_SPEED));
const el = (tag, cls) => { const e = document.createElement(tag); if (cls) e.className = cls; return e; };
const scrollDown = () => chat.scrollTo({ top: chat.scrollHeight, behavior: 'smooth' });
const fill = s => s.replace(/\{name\}/g, A.name || '');

/* Печатная машинка: текст появляется по буквам, в конце мигает курсор «_» */
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
async function typeInto(node, text, perChar){
  const out = document.createElement('span'), cur = el('span', 'cursor');
  cur.textContent = '_'; node.append(out, cur);
  if (REDUCED){ out.textContent = text; cur.remove(); return; }
  const chars = [...text];
  for (let i = 0; i < chars.length; i++){
    out.textContent += chars[i];
    if (i % 12 === 0) scrollDown();
    await sleep(/[.,!?…:]/.test(chars[i]) ? perChar * 6 : perChar);
  }
  cur.remove();
}
async function bot(text){
  chat.querySelectorAll('.msg.bot:not(.past)').forEach(m => m.classList.add('past'));
  const t = el('div', 'msg bot new');
  chat.append(t); scrollDown();
  await sleep(260);
  await typeInto(t, text, 18);
  scrollDown();
  await sleep(200);
}
async function user(text){
  const m = el('div', 'msg user new'); chat.append(m); scrollDown();
  await typeInto(m, text, 10);
}
function note(text){
  const n = el('div', 'note'); n.textContent = text; chat.append(n); scrollDown();
}
function chip(label, extra){
  const b = el('button', 'chip' + (extra ? ' ' + extra : '')); b.type = 'button'; b.textContent = label; return b;
}

function ask(q){
  return new Promise(resolve => {
    composer.innerHTML = '';
    const done = (value, display) => {
      idle();
      resolve({ value, display: display ?? (Array.isArray(value) ? value.join(', ') : String(value)) });
    };
    ({ text: renderText, choice: renderChoice, multi: renderMulti, scale: renderScale })[q.type](q, done);
    scrollDown();
  });
}

// Неактивное поле ввода, пока бот печатает
function idle(){
  composer.innerHTML = '';
  const row = el('div', 'inputrow inputbox');
  const ta = el('textarea'); ta.rows = 1; ta.disabled = true; ta.placeholder = 'Напишите ответ…';
  ta.setAttribute('aria-hidden', 'true'); ta.tabIndex = -1;
  const btn = el('button', 'send'); btn.type = 'button'; btn.disabled = true; btn.innerHTML = SEND_ICON; btn.tabIndex = -1;
  btn.setAttribute('aria-hidden', 'true');
  const bar = el('div', 'inputbar'); bar.append(btn);
  row.append(ta, bar); composer.append(row);
}

function renderText(q, done){
  const row = el('div', 'inputrow inputbox');
  const ta = el('textarea'); ta.rows = 1; ta.placeholder = q.placeholder || 'Напишите ответ…';
  if (q.inputmode) ta.inputMode = q.inputmode;
  const btn = el('button', 'send'); btn.type = 'button'; btn.innerHTML = SEND_ICON; btn.disabled = true;
  btn.setAttribute('aria-label', 'Отправить');
  const submit = () => { const v = ta.value.trim(); if (v) done(v); };
  ta.addEventListener('input', () => {
    btn.disabled = !ta.value.trim();
    ta.style.height = 'auto'; ta.style.height = Math.min(ta.scrollHeight, 130) + 'px';
  });
  ta.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); submit(); } });
  btn.onclick = submit;
  const bar = el('div', 'inputbar'); bar.append(btn);
  row.append(ta, bar); composer.append(row);
  if (q.optional){
    const r = el('div', 'row2'); const s = el('button', 'link'); s.type = 'button';
    s.textContent = 'Пропустить'; s.onclick = () => done('', 'Пропущу');
    r.append(s); composer.append(r);
  }
  setTimeout(() => ta.focus(), 60);
}

function renderChoice(q, done){
  const wrap = el('div', 'chips');
  q.options.forEach(o => {
    const b = chip(o);
    b.onclick = () => {
      if (q.custom && o === q.custom){ composer.innerHTML = ''; renderText({ placeholder:'Напишите свой вариант…' }, done); }
      else done(o);
    };
    wrap.append(b);
  });
  composer.append(wrap);
}

function renderMulti(q, done){
  const sel = new Set();
  const hint = el('div', 'hint'); hint.textContent = 'Можно выбрать несколько'; composer.append(hint);
  const wrap = el('div', 'chips');
  const ok = chip('Готово', 'primary'); ok.disabled = true;
  const btns = q.options.map(o => {
    const b = chip(o); b.setAttribute('aria-pressed', 'false');
    b.onclick = () => {
      if (o === q.exclusive){ sel.clear(); sel.add(o); }
      else {
        sel.delete(q.exclusive);
        sel.has(o) ? sel.delete(o) : sel.add(o);
      }
      btns.forEach((x, i) => { const on = sel.has(q.options[i]); x.classList.toggle('on', on); x.setAttribute('aria-pressed', on); });
      ok.disabled = sel.size === 0;
    };
    return b;
  });
  wrap.append(...btns); composer.append(wrap);
  const r = el('div', 'chips'); r.style.marginTop = '12px'; r.append(ok); composer.append(r);
  ok.onclick = () => done(q.options.filter(o => sel.has(o)));
}

function renderScale(q, done){
  const wrap = el('div', 'scale');
  for (let i = 1; i <= 10; i++){ const b = chip(String(i)); b.onclick = () => done(i, String(i)); wrap.append(b); }
  const legend = el('div', 'scale-legend');
  legend.innerHTML = '<span>не готов(а)</span><span>на все 100</span>';
  composer.append(wrap, legend);
}

function isActive(q){
  if (CONFIG.SHORT_MODE && !SHORT_IDS.includes(q.id)) return false;
  return !(q.skip && q.skip(A));
}

function updateProgress(){
  const visible = QUESTIONS.filter(isActive);
  const answered = visible.filter(q => q.id in A).length;
  progressBar.style.width = Math.round(answered / visible.length * 100) + '%';
}

const plural = (n, f) => f[(n % 10 === 1 && n % 100 !== 11) ? 0 : (n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 10 || n % 100 >= 20)) ? 1 : 2];

async function send(payload){
  if (!CONFIG.SCRIPT_URL){ console.log('Демо-режим: SCRIPT_URL не указан. Данные анкеты:', payload); return true; }
  try{
    await fetch(CONFIG.SCRIPT_URL, {
      method:'POST', mode:'no-cors',
      headers:{ 'Content-Type':'text/plain;charset=utf-8' },
      body: JSON.stringify(payload)
    });
    return true;
  } catch (e){ console.error('Не удалось отправить анкету', e); return false; }
}

/* ================== СЦЕНАРИЙ ================== */
function collect(){
  const answers = Object.fromEntries(Object.entries(A).map(([k, v]) => [k, Array.isArray(v) ? v.join(', ') : v]));
  const fields = QUESTIONS.filter(q => !CONFIG.SHORT_MODE || SHORT_IDS.includes(q.id))
    .map(q => ({ label: q.label, value: answers[q.id] ?? '' }));
  return { answers, fields };
}

async function finish(){
  composer.innerHTML = '';
  const { answers, fields } = collect();
  const payload = {
    short: CONFIG.SHORT_MODE,
    answers,
    fields: [{ label:'Тип заявки', value: CONFIG.SHORT_MODE ? 'Короткая' : 'Анкета' }, ...fields]
  };
  const sending = send(payload);

  await bot(`${A.name}, спасибо! ✅`);
  if (CONFIG.SHORT_MODE){
    await bot('Мы получили ваши контакты и свяжемся с вами в ближайшее время.');
  } else {
    await bot('Вы только что сделали то, на что многие не решаются годами: честно описали, где вы сейчас, и назвали свою цель.');
    const ch = (A.channels || []).filter(c => c !== NONE);
    if (ch.length === 0){
      await bot('Продвижение пока не выстроено — и это хорошая новость. Значит, ваш потолок гораздо выше, чем кажется сейчас.');
    } else if (ch.length <= 3){
      await bot(`Сейчас вы используете ${ch.length} ${plural(ch.length, ['канал','канала','каналов'])} продвижения. Каждый неиспользованный канал — это не слабость, а резерв новых клиентов.`);
    } else {
      await bot('У вас уже есть база: несколько каналов продвижения. Теперь задача — превратить их в систему, которая стабильно приводит клиентов.');
    }
    await bot('Если многое из этого вы ещё не делали — впереди много работы. Но теперь у вас есть точка А и точка Б, а значит, можно построить маршрут.');
    await bot('Мы изучим ваши ответы и свяжемся с вами в течение 24 часов.');
  }
  const ok = await sending;
  note(ok ? 'Ответы отправлены' : 'Не получилось отправить ответы. Проверьте интернет и обновите страницу.');
  progressBar.style.width = '100%';
}

async function run(){
  idle();
  await bot('Здравствуйте! 👋');
  if (CONFIG.SHORT_MODE){
    await bot('Оставьте, пожалуйста, имя, Instagram и номер телефона — это займёт полминуты.');
  } else {
    await bot('Ответьте на несколько коротких вопросов — это займёт 2 минуты.');
    await bot('По ответам мы поймём, где вы сейчас и чем можем помочь именно вам.');
  }
  for (const q of QUESTIONS){
    if (!isActive(q)) continue;
    if (!CONFIG.SHORT_MODE) for (const m of (q.intro || [])) await bot(fill(m));
    await bot(fill(typeof q.text === 'function' ? q.text(A) : q.text));
    let r, previous = '';
    while (true){
      r = await ask(q);
      await user(r.display);
      if (previous) r.value = previous + ', ' + r.value;
      const error = q.validate ? q.validate(r.value) : null;
      if (!error) break;
      if (q.mergeOnRetry && /[a-zA-Z@]/.test(r.value)) previous = r.value;
      await bot(error);
    }
    A[q.id] = r.value;
    updateProgress();
    if (q.react){ const m = q.react(r.value, A); if (m) await bot(fill(m)); }
  }
  await finish();
}

run();
</script>
